services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: autoparts
      POSTGRES_USER: autoparts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoparts}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoparts -d autoparts"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - autoparts_pg:/var/lib/postgresql

  db-prepare:
    image: postgres:18.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_ADMIN_USER: autoparts
      POSTGRES_ADMIN_DB: autoparts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoparts}
      KEYCLOAK_DB_PASSWORD: keycloak
      SEED_DEMO_DATA: "true"
    volumes:
      - ./dev/postgres:/dev/postgres:ro
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "/dev/postgres/prepare.sh"]
    restart: "no"

  keycloak:
    image: ${KEYCLOAK_IMAGE:-keycloak/keycloak:26.7.0}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-change-me}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/autoparts-realm.json:/opt/keycloak/data/import/autoparts-realm.json:ro
    depends_on:
      db-prepare:
        condition: service_completed_successfully

  keycloak-sync:
    image: ${KEYCLOAK_IMAGE:-keycloak/keycloak:26.7.0}
    entrypoint: ["/bin/sh", "/opt/keycloak/sync-dev.sh"]
    environment:
      KEYCLOAK_SYNC_SERVER: http://keycloak:8080
      KEYCLOAK_REALM: autoparts
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-change-me}
      KEYCLOAK_DEV_PASSWORD: ${KEYCLOAK_DEV_PASSWORD:-ChangeMe123!}
    volumes:
      - ./keycloak/sync-dev.sh:/opt/keycloak/sync-dev.sh:ro
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"

  keycloak-qa-sync:
    image: ${KEYCLOAK_IMAGE:-keycloak/keycloak:26.7.0}
    entrypoint: ["/bin/sh", "/opt/keycloak/sync-qa-client.sh"]
    environment:
      KEYCLOAK_SYNC_SERVER: http://keycloak:8080
      KEYCLOAK_REALM: autoparts
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-change-me}
    volumes:
      - ./keycloak/sync-qa-client.sh:/opt/keycloak/sync-qa-client.sh:ro
    depends_on:
      keycloak-sync:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: "${GO_MODULE_PROXY:-https://proxy.golang.org|https://goproxy.cn|direct}"
        GOSUMDB: "${GO_SUMDB:-sum.golang.google.cn}"
        VERSION: "${APP_VERSION:-0.15.0-rc.1}"
        COMMIT: "${APP_COMMIT:-dev}"
        BUILD_TIME: "${APP_BUILD_TIME:-unknown}"
    environment:
      DATABASE_URL: postgres://autoparts:${POSTGRES_PASSWORD:-autoparts}@postgres:5432/autoparts?sslmode=disable
      KEYCLOAK_ISSUER: http://localhost:8081/realms/autoparts
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/autoparts/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: autoparts-api
      PORT: "8080"
      ALLOWED_ORIGINS: http://localhost:3000
      RATE_LIMIT_PER_MINUTE: "600"
      PUBLIC_SEARCH_RATE_LIMIT_PER_MINUTE: "120"
      TRUST_PROXY_HEADERS: "false"
      ENABLE_HSTS: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/readyz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 20
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      db-prepare:
        condition: service_completed_successfully
      keycloak-qa-sync:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_MOCK_MODE: "false"
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8081
        NEXT_PUBLIC_KEYCLOAK_REALM: autoparts
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: autoparts-web
        NEXT_PUBLIC_SHOW_DEV_CREDENTIALS: "true"
        NEXT_PUBLIC_EDGE_INSTALLER_URL: "${NEXT_PUBLIC_EDGE_INSTALLER_URL:-}"
        NEXT_PUBLIC_STORE_EDGE_URL: http://127.0.0.1:17624
        NEXT_PUBLIC_STORE_EDGE_MANAGER_URL: http://127.0.0.1:17623
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_MOCK_MODE: "false"
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8081
      NEXT_PUBLIC_KEYCLOAK_REALM: autoparts
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: autoparts-web
      NEXT_PUBLIC_SHOW_DEV_CREDENTIALS: "true"
      NEXT_PUBLIC_EDGE_INSTALLER_URL: "${NEXT_PUBLIC_EDGE_INSTALLER_URL:-}"
      NEXT_PUBLIC_STORE_EDGE_URL: http://127.0.0.1:17624
      NEXT_PUBLIC_STORE_EDGE_MANAGER_URL: http://127.0.0.1:17623
    ports:
      - "3000:3000"
    depends_on:
      - api
      - keycloak

volumes:
  autoparts_pg:
