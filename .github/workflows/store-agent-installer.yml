name: Store Agent Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Store Agent version
        required: true
        default: 0.15.7.1
  push:
    tags:
      - "store-agent-v*"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CODE_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_PFX_BASE64 }}
      CODE_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^store-agent-v', ''
          }
          if (-not $version) { throw "Store Agent version is empty" }
          "STORE_AGENT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test Store Edge
        shell: pwsh
        run: |
          go test ./internal/storeedge
          go test ./cmd/store-edge

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Import optional code-signing certificate
        if: ${{ env.CODE_SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          PFX_BASE64: ${{ env.CODE_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ env.CODE_SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "autoparts-code-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          if (-not $cert.Thumbprint) { throw "Code-signing certificate import failed" }
          "AUTOPARTS_SIGN_CERT_SHA1=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item $pfx -Force

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File edge/windows/build-installer.ps1 -Version $env:STORE_AGENT_VERSION

      - name: Upload customer installer
        uses: actions/upload-artifact@v4
        with:
          name: AutoParts-Store-Agent-Setup-${{ env.STORE_AGENT_VERSION }}
          path: |
            dist/AutoParts-Store-Agent-Setup-${{ env.STORE_AGENT_VERSION }}.exe
            dist/AutoParts-Store-Agent-Setup-${{ env.STORE_AGENT_VERSION }}.exe.sha256
          if-no-files-found: error
          retention-days: 30
